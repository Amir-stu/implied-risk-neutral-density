[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "implied-rnd"
version = "0.1.0"
description = "Recover the market's risk-neutral probability distribution from listed option prices."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Amir Ben Khadher" }]
requires-python = ">=3.10"
keywords = ["options", "risk-neutral density", "breeden-litzenberger", "svi", "implied volatility"]
classifiers = [
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
yahoo = ["yfinance>=0.2.40"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "matplotlib>=3.7",
    "ruff>=0.5",
]

[project.scripts]
rnd = "rnd.cli:main"

[project.urls]
Source = "https://github.com/Amir-stu/implied-risk-neutral-density"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rnd = ["sample_data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["rnd"]
omit = ["*/plotting.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
